<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloudforge Items</title>
  <style>
    body { max-width: 680px; margin: 50px auto; padding: 0 18px; font: 16px system-ui; color: #172033; }
    h1 { margin-bottom: 4px; }
    p { color: #596579; }
    form, .item { padding: 18px; margin: 18px 0; border: 1px solid #d8deea; border-radius: 12px; }
    label { display: block; margin: 12px 0 5px; font-weight: 600; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #aeb9ca; border-radius: 7px; font: inherit; }
    textarea { min-height: 75px; }
    button { margin-top: 14px; padding: 10px 16px; border: 0; border-radius: 7px; background: #245fce; color: white; font: inherit; cursor: pointer; }
    #status { min-height: 24px; }
    .item p { margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>Cloudforge Items</h1>
  <p>Add an item or view the items saved by your API.</p>

  <form id="form">
    <label for="name">Name</label>
    <input id="name" required>
    <label for="description">Description</label>
    <textarea id="description"></textarea>
    <button id="submit">Add item</button>
  </form>

  <p id="status">Loading…</p>
  <h2>Saved items</h2>
  <div id="items"></div>

  <script>
    const endpoint = "/.netlify/functions/items";
    const status = document.querySelector("#status");
    const list = document.querySelector("#items");

    async function loadItems() {
      status.textContent = "Loading items…";
      try {
        const response = await fetch(endpoint);
        const items = await response.json();
        if (!response.ok) throw new Error(items.error || "Could not load items.");

        list.replaceChildren();
        if (!items.length) {
          list.textContent = "No items yet.";
        } else {
          for (const item of items) {
            const card = document.createElement("div");
            card.className = "item";
            const name = document.createElement("strong");
            name.textContent = item.name;
            const description = document.createElement("p");
            description.textContent = item.description || "No description";
            card.append(name, description);
            list.append(card);
          }
        }
        status.textContent = "Connected.";
      } catch (error) {
        status.textContent = error.message || "Could not connect. Try refreshing.";
      }
    }

    document.querySelector("#form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.querySelector("#submit");
      button.disabled = true;
      status.textContent = "Saving…";
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.querySelector("#name").value.trim(),
            description: document.querySelector("#description").value.trim()
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not save item.");
        event.target.reset();
        await loadItems();
        status.textContent = "Item saved.";
      } catch (error) {
        status.textContent = error.message || "Could not save item.";
      } finally {
        button.disabled = false;
      }
    });

    loadItems();
  </script>
</body>
</html>
